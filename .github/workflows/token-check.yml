name: 토큰 상태 점검

# 매주 한 번 인스타 토큰이 살아 있는지 확인하고,
# 만료가 가까워지거나 이미 죽었으면 GitHub 이슈를 열어 알려줍니다.
# 이슈가 열리면 GitHub이 가입 이메일로 알림을 보내줍니다.

on:
  schedule:
    # 매주 월요일 10:00 (한국시간) = 월요일 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# ⚠️ 코드가 insta-cardnews/ 폴더 안에 있는 구조 기준입니다.
#    나중에 파일들을 저장소 루트로 옮기면 아래 defaults 두 줄을 지우세요.
defaults:
  run:
    working-directory: insta-cardnews

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 토큰 점검
        id: check
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_AUTH_MODE: ${{ vars.IG_AUTH_MODE || 'instagram' }}
        run: |
          # 결과를 로그뿐 아니라 요약 화면에도 남깁니다.
          # 매번 로그를 파고들지 않아도 무슨 일인지 바로 보이게 하기 위함입니다.
          set +e
          python src/main.py check --warn-days 10 2>&1 | tee /tmp/check.log
          CODE=${PIPESTATUS[0]}
          {
            if [ "$CODE" = "0" ]; then
              echo "## ✅ 토큰 정상"
            else
              echo "## ❌ 점검 실패 (exit $CODE)"
            fi
            echo ""
            echo '```'
            cat /tmp/check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      - name: 알림 이슈 만들기
        if: steps.check.outcome == 'failure' || steps.check.outputs.needs_refresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.check.outcome }}
          TOKEN_OK: ${{ steps.check.outputs.token_ok }}
          DAYS: ${{ steps.check.outputs.days_left }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create token-alert --color D93F0B --description "인스타 토큰 알림" --force || true

          OPEN=$(gh issue list --label token-alert --state open --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "이미 열린 알림 이슈가 있어 건너뜁니다."
            exit 0
          fi

          # 점검이 실패했다고 무조건 '토큰 만료'는 아닙니다.
          # token_ok 로 '토큰이 진짜 거부됐는지' 와
          # '스크립트가 다른 이유로 죽었는지' 를 구분합니다.
          if [ "$OUTCOME" = "failure" ] && [ "$TOKEN_OK" = "false" ]; then
            TITLE="🔴 인스타 토큰이 만료됐습니다 — 주간 게시가 멈춥니다"
            HEAD="인스타그램이 토큰을 거부했습니다. **이미 게시가 멈췄거나 곧 멈춥니다.** 아래 순서로 갱신해 주세요."
            BODY_FILE=docs/token-alert.md
          elif [ "$OUTCOME" = "failure" ]; then
            TITLE="🟠 토큰 점검이 실패했습니다 (토큰 문제는 아닐 수 있음)"
            HEAD="점검 도중 오류가 났지만 **토큰 만료로 확인된 것은 아닙니다.** 설정 파일 문법 오류처럼 다른 원인일 수 있으니, 아래 실행 기록에서 진짜 원인을 먼저 확인하세요."
            EXTRA="원인을 고친 뒤 Actions 에서 **토큰 상태 점검**을 다시 실행하고, 정상이면 이 이슈를 닫아주세요."
            BODY_FILE=""
          else
            TITLE="🟡 인스타 토큰 만료 ${DAYS}일 전 — 갱신이 필요합니다"
            HEAD="토큰 만료가 **약 ${DAYS}일** 남았습니다. 지금 갱신해 두시면 게시가 끊기지 않습니다."
            BODY_FILE=docs/token-alert.md
          fi

          {
            echo "$HEAD"
            echo ""
            echo "👉 [이번 실행 기록 열기]($RUN_URL)"
            echo ""
            [ -n "$EXTRA" ] && { echo "$EXTRA"; echo ""; }
            [ -n "$BODY_FILE" ] && cat "$BODY_FILE"
          } > /tmp/token-issue.md
          gh issue create --title "$TITLE" --label token-alert --body-file /tmp/token-issue.md
